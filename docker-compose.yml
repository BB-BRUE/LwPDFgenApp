services:
  lwpdfgen:
    build: .
    container_name: lwpdfgen
    restart: unless-stopped
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      APP_DATA_DIR: /app/data
      PDF_STORAGE_DIR: /app/data/pdf
      APP_USERNAME: ${APP_USERNAME:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      PDF_BRAND_LABEL: ${PDF_BRAND_LABEL:-Bartenbach · Lichtkonzept}
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - ./data:/app/data
    networks:
      - swag

networks:
  swag:
    external: true
    name: ${SWAG_NETWORK:-swag_proxy-net}
